# Ghostty Features Registry
# 포맷: NAME|CATEGORY|WHEN|HOW|EXAMPLE|HINT_TRIGGER
# HINT_TRIGGER: cmd:<glob> 또는 exit:<code> — 이 패턴 실행 후 힌트 표시

Image Paste|clipboard|클립보드 이미지를 다룰 때 (Claude Code엔 Ctrl+V, 파일 경로가 필요하면 Cmd+Shift+V)|Claude Code=Ctrl+V / 그 외=Cmd+Shift+V|스크린샷 → Ctrl+V로 Claude Code 첨부, 또는 Cmd+Shift+V로 /tmp/clipboard_img_out.png 경로 삽입|cmd:open*

Broadcast Input|multi-terminal|여러 서버/터미널에 동시에 같은 명령 실행할 때|ghostty-broadcast --toggle|ghostty-broadcast 'kubectl get pods --all-namespaces'|cmd:ssh*

SSH New Window|remote|SSH 접속을 새 Ghostty 창/탭으로 열고 싶을 때|ssht user@host|ssht --tab prod-server -p 2222|cmd:ssh*

Line Timestamps|productivity|커맨드 실행 시각과 소요 시간을 확인하고 싶을 때|자동 활성 (zsh-integration)|npm install 후 '─── 14:23 ✓ 46.2s' 자동 표시|

Triggers|automation|특정 커맨드 완료/에러 시 자동 알림·벨·스크립트 실행|~/.config/ghostty/triggers 파일 편집|echo "cmd:docker*  notify Docker" >> ~/.config/ghostty/triggers|exit:!0

Quick Terminal|window|어디서든 단축키 하나로 터미널 소환|ghostty config에 keybind 설정|keybind = super+backquote=toggle_quick_terminal|

notify-on-command-finish|productivity|오래 걸리는 커맨드가 끝나면 자리 비워도 알림|ghostty config에 추가|notify-on-command-finish = unfocused|cmd:npm*

write_screen_file|export|현재 터미널 화면을 파일로 저장 (HTML/plain/ANSI)|Cmd+Shift+J|저장 후 경로 자동 paste. HTML 포맷은 색상 보존|

ghostty-broadcast --list|multi-terminal|현재 열려있는 터미널 TTY 목록 확인|ghostty-broadcast --list|열린 창 수 및 TTY 경로 확인|

Profile Auto-Switch|remote|SSH 접속 시 배경색이 자동으로 변경됨 (원격/로컬 구분)|자동 ($SSH_CONNECTION 감지)|SSH 세션에서 배경 '#1a0d0d' 어두운 빨강으로 전환|cmd:ssh*

Inline Image Display|image|이미지/PDF 썸네일을 터미널에 인라인 표시 (kitty graphics, 보기 전용)|ghostty-icat <파일> [너비]|ghostty-icat shot.png 40 → 터미널에 이미지 렌더. 첨부는 img-paste|cmd:open*
